(()=>{'use strict';const KEY='ufo-classroom-v1',sample=['小明','小美','小華','小安','小宇','小晴','小杰','小涵','小恩','小芳','小軒','小婷'];const $=id=>document.getElementById(id);let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.classes)||!data.classes.length)data={active:'demo',classes:[{id:'demo',name:'示範班級',names:sample,drawn:[]}]};let active=()=>data.classes.find(c=>c.id===data.active)||data.classes[0];function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn('無法儲存',e)}}let soundOn=true,audio;function tone(freq=400,duration=.15,type='sine',vol=.09,delay=0){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.65),t+duration);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration+.02)}catch{}}function music(){[523,659,784,1047].forEach((n,i)=>tone(n,.23,'triangle',.07,i*.14))}

function ufo(x,y,t,beam=0){ctx.save();ctx.translate(x,y);const bob=Math.sin(t*.004)*8;ctx.translate(0,bob);if(beam){const grad=ctx.createLinearGradient(0,20,0,580);grad.addColorStop(0,'#9cf9ff9c');grad.addColorStop(1,'#a2fbff0c');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(-52,17);ctx.lineTo(52,17);ctx.lineTo(145,570);ctx.lineTo(-145,570);ctx.fill();ctx.fillStyle='#b4fff51e';ctx.beginPath();ctx.ellipse(0,570,145,20,0,0,Math.PI*2);ctx.fill()}ellipse(0,4,142,40,'#273b77');const hull=ctx.createLinearGradient(0,-42,0,37);hull.addColorStop(0,'#ffffff');hull.addColorStop(.45,'#cbd8ff');hull.addColorStop(1,'#4b60b4');ellipse(0,-5,143,36,hull);const dome=ctx.createRadialGradient(-25,-55,4,0,-18,90);dome.addColorStop(0,'#e7ffff');dome.addColorStop(.45,'#71eaff');dome.addColorStop(1,'#2774d4');ellipse(0,-23,69,56,dome);ellipse(0,-29,56,44,'#8deaff55');ellipse(-22,-46,19,10,'#ffffff99');ellipse(0,1,142,27,'#7e9de2');for(let i=0;i<9;i++){const xx=-115+i*29;ellipse(xx,14+8*Math.sin(i),7,7,['#ffdf69','#8affdd','#ff94c8'][i%3])}ellipse(0,28,35,10,'#ffe77d');ctx.restore()}
let people=[];function positions(){const c=active();people=c.names.filter(n=>!c.drawn.includes(n)).map((name,i,arr)=>{const cols=Math.min(14,Math.max(1,arr.length));const row=Math.floor(i/cols),col=i%cols;const count=Math.min(cols,arr.length-row*cols);return{name,x:W/2+(col-(count-1)/2)*Math.min(91,1130/cols),y:580+row*8,i}})}function update(){const c=active(),left=c.names.length-c.drawn.length;$('classLabel').textContent='🌟 '+c.name;$('remaining').textContent=`剩餘 ${left} / ${c.names.length} 人`;$('countLeft').textContent=left;$('countDone').textContent=c.drawn.length;$('draw').disabled=phase!=='idle'||left===0;$('lastResult').textContent=c.drawn.length?'最近抓走：'+c.drawn[c.drawn.length-1]:'👽 外星人正在等你！';if(!left&&phase==='idle')$('status').textContent='🎉 全班都被抓走啦！';positions()}function setPhase(v){phase=v;phaseAt=performance.now()}function frame(t){ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.clearRect(0,0,W,H);background(t);const elapsed=t-phaseAt;let ux=640,uy=150,beam=0;if(phase==='enter'){let q=Math.min(1,elapsed/1400);ux=-180+(820*q*q*(3-2*q));uy=100+55*q;if(elapsed>1400){setPhase('search');panicSounds();$('status').textContent='😱 啊啊啊！外星人來啦！快跑！'}}else if(phase==='search'){ux=640+Math.sin(elapsed*.004)*390;uy=145+Math.sin(elapsed*.003)*30;if(elapsed>2300){setPhase('lock');tone(900,.4,'sawtooth',.055)}}else if(phase==='lock'){ux=target?target.x:640;uy=150;beam=Math.min(1,elapsed/450);if(elapsed>1050){setPhase('lift');tractorSound();$('status').textContent='🛸 抓到了！救命啊啊啊！'}}else if(phase==='lift'){ux=target?target.x:640;uy=150;beam=1;if(elapsed>1800){const c=active();c.drawn.push(selected);persist();$('winner').textContent=selected;$('win').classList.add('show');$('flash').animate([{opacity:.7},{opacity:0}],{duration:650});music();setPhase('celebrate');update()}}else if(phase==='celebrate'){ux=target?target.x:640;uy=150;if(elapsed>2600){$('win').classList.remove('show');selected=null;target=null;setPhase('idle');$('status').textContent='✨ 下一位會是誰呢？';update()}}else{ux=640+Math.sin(t*.0007)*160;uy=110}people.forEach((p,i)=>{if(p.name===selected&&phase==='lift'){const q=Math.min(1,elapsed/1800);student(p,i,t,1-q*.8,-q*420,1-q*.45)}else student(p,i,t)});ufo(ux,uy,t,beam);requestAnimationFrame(frame)}requestAnimationFrame(frame);function randomInt(max){if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1);const limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}return Math.floor(Math.random()*max)}$('draw').onclick=()=>{if(phase!=='idle')return;const c=active(),pool=c.names.filter(n=>!c.drawn.includes(n));if(!pool.length)return;selected=pool[randomInt(pool.length)];target=people.find(p=>p.name===selected);$('status').textContent='🚨 UFO 入侵！全班快逃！';alienArrival();panicStart=performance.now();setPhase('enter');update()};$('reset').onclick=()=>{if(phase!=='idle')return;if(!confirm('確定要重置目前班級的抽籤紀錄嗎？'))return;active().drawn=[];persist();$('status').textContent='🔄 全班重新集合！';update()};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 音效開':'🔇 音效關';if(soundOn)tone(620)};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('shell').requestFullscreen()}catch{alert('目前瀏覽器不支援全螢幕，可使用電腦瀏覽器開啟。')}};function openModal(){if(phase!=='idle')return;refreshClasses();$('modal').classList.add('show')}function refreshClasses(){const c=active();$('classSelect').innerHTML='';data.classes.forEach(v=>{const opt=document.createElement('option');opt.value=v.id;opt.textContent=v.name;$('classSelect').appendChild(opt)});$('classSelect').value=c.id;$('className').value=c.name;$('names').value=c.names.join('\n')}$('manage').onclick=openModal;$('cancel').onclick=()=>$('modal').classList.remove('show');$('classSelect').onchange=()=>{data.active=$('classSelect').value;persist();refreshClasses();update()};$('newClass').onclick=()=>{const name=prompt('新班級名稱：','新班級');if(!name||!name.trim())return;const id='class_'+Date.now()+'_'+Math.random().toString(36).slice(2);data.classes.push({id,name:name.trim(),names:[],drawn:[]});data.active=id;persist();refreshClasses();update()};$('deleteClass').onclick=()=>{if(data.classes.length<=1){alert('至少要保留一個班級');return}if(!confirm('確定刪除這個班級及其抽籤紀錄嗎？'))return;data.classes=data.classes.filter(c=>c.id!==data.active);data.active=data.classes[0].id;persist();refreshClasses();update()};$('save').onclick=()=>{const c=active(),name=$('className').value.trim(),names=[...new Set($('names').value.split(/\r?\n|,|，/).map(s=>s.trim()).filter(Boolean))];if(!name){alert('請輸入班級名稱');return}if(!names.length){alert('請至少輸入一位學生');return}if(names.length>100){alert('為維持畫面清楚，每班最多 100 位學生');return}c.name=name;c.names=names;c.drawn=c.drawn.filter(n=>names.includes(n));persist();update();$('modal').classList.remove('show');$('status').textContent='✨ 名單已準備好！'};$('skip').onclick=()=>{$('historyText').textContent=active().drawn.length?active().drawn.map((n,i)=>`${i+1}. ${n}`).join('\n'):'尚未抽出任何學生';$('historyModal').classList.add('show')};$('historyClose').onclick=()=>$('historyModal').classList.remove('show');update();})();
</script></body></html>
