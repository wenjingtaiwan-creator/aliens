function draw(){let c=current(),available=c.students.map((name,i)=>({name,i})).filter(x=>!c.picked.includes(x.name)),host=$('students');host.innerHTML='';let n=available.length;available.forEach((s,j)=>{let d=document.createElement('div');d.className='student';d.dataset.name=s.name;let row=j%2;let pos=7+86*(j+.5)/Math.max(n,1);d.style.left=pos+'%';d.style.bottom=(row?21:19)+'%';d.style.zIndex=4+row;d.innerHTML=`<span class="name"></span>${charSvg(s.i)}`;d.querySelector('.name').textContent=c.mode==='number'?s.name+'號':displayMode==='number'?String(s.i+1).padStart(2,'0')+'號':displayMode==='both'?String(s.i+1).padStart(2,'0')+'號 '+s.name:s.name;host.append(d)})}
function tone(freq,duration,type='sine',volume=.08,slide=0){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+duration);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration+.02)}catch{}}
function screamBurst(index=0){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime+Math.random()*.08;const osc=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();osc.type=index%2?'sawtooth':'triangle';filter.type='bandpass';filter.frequency.value=900+Math.random()*700;filter.Q.value=.7;let start=420+Math.random()*260;osc.frequency.setValueAtTime(start,t);osc.frequency.linearRampToValueAtTime(start*1.8,t+.16);osc.frequency.linearRampToValueAtTime(start*.85,t+.5);gain.gain.setValueAtTime(.001,t);gain.gain.linearRampToValueAtTime(.037,t+.08);gain.gain.linearRampToValueAtTime(.025,t+.25);gain.gain.exponentialRampToValueAtTime(.001,t+.55);osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.58)}catch{}}
function soundSequence(kind){if(kind==='approach'){tone(95,1.4,'sawtooth',.09,150);schedule(()=>tone(190,.8,'triangle',.08,-90),600)}if(kind==='panic'){for(let k=0;k<13;k++)schedule(()=>screamBurst(k),k*240);for(let k=0;k<4;k++)schedule(()=>tone(165+k*25,.33,'sawtooth',.025,90),k*680)}if(kind==='beam'){tone(680,2.2,'sawtooth',.07,-570);tone(135,2.2,'triangle',.07,200)}if(kind==='win'){[440,554,659,880].forEach((f,i)=>schedule(()=>tone(f,.22,'sine',.1),i*170))}}
function say(t,ms=1200){$('alert').textContent=t;$('alert').classList.add('show');schedule(()=>$('alert').classList.remove('show'),ms)}function toast(t,ms=1700){$('toast').textContent=t;$('toast').classList.add('show');schedule(()=>$('toast').classList.remove('show'),ms)}
async function start(){if(busy)return;let c=current(),remaining=c.students.filter(s=>!c.picked.includes(s));if(!remaining.length){toast('全班都被抓走了！請重置本輪');return}busy=true;$('start').disabled=true;$('alert').classList.remove('show');$('ufo').classList.add('arrive');soundSequence('approach');await wait(1100);$('ufo').classList.add('searching');$('stage').classList.add('alarm');say('😱 啊啊啊！外星人來啦！快逃！',1800);soundSequence('panic');let chars=[...document.querySelectorAll('.student')];chars.forEach((el,i)=>{el.classList.add('panic');el.dataset.scream=['ÁÁÁ!','救命！','AAAA!','快跑！','ỐI!'][i%5];el.style.setProperty('--run-speed',(.52+Math.random()*.62).toFixed(2)+'s');for(let j=1;j<=4;j++)el.style.setProperty('--dx'+j,Math.round((Math.random()-.5)*42)+'px')});
// 每人有不同方向與速度，連續數波逃跑，避免只在原地抖動
for(let wave=0;wave<5;wave++){chars.forEach((el,i)=>{let x=parseFloat(el.style.left),step=(Math.random()-.5)*23;el.style.left=Math.min(95,Math.max(5,x+step))+'%';el.style.bottom=(19+Math.random()*2)+'%';el.style.zIndex=4+Math.round(Math.random()*3)});await wait(420)}
$('stage').classList.remove('alarm');let chosen=remaining[Math.floor(Math.random()*remaining.length)],target=chars.find(el=>el.dataset.name===chosen);$('ufo').classList.remove('searching');say('🛸 鎖定目標！',950);await wait(450);$('beam').classList.add('on');soundSequence('beam');if(target){target.classList.remove('panic');target.classList.add('selected','caught');screamBurst(2)}await wait(2600);$('beam').classList.remove('on');chars.forEach(x=>x.classList.remove('panic'));c.picked.push(chosen);soundSequence('win');say('🎉 '+(c.mode==='number'?chosen+'號':String(c.students.indexOf(chosen)+1).padStart(2,'0')+'號 '+chosen)+' 被外星人抓走啦！',2300);$('ufo').classList.remove('arrive');await wait(1300);busy=false;update();toast('本輪抽中：'+(c.mode==='number'?chosen+'號':String(c.students.indexOf(chosen)+1).padStart(2,'0')+'號 '+chosen),2400)}
function modal(html){$('modal').innerHTML=html;$('overlay').classList.add('open')};function close(){$('overlay').classList.remove('open')};$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});function edit(){let c=current();if(c.mode==='number'){numberSetup();return}modal(`<h2>✏️ 編輯「${escapeHtml(c.name)}」名單</h2><p class="notice">每行一位學生，名單順序就是座號（第一位為 01 號）。也可貼上「01 王小明」格式，系統會辨識前方編號。修改名單會保留仍存在的已抽籤紀錄。</p><textarea id="names"></textarea><div class="actions"><button id="cancel">取消</button><button id="saveNames">儲存名單</button></div>`);$('names').value=c.students.join('\n');$('cancel').onclick=close;$('saveNames').onclick=()=>{let names=[...new Set($('names').value.split(/[\n,，、;；]+/).map(s=>s.trim()).filter(Boolean))];if(names.length>60){alert('為維持畫面清楚，單班最多 60 人');return}c.students=names.map(s=>s.replace(/^\s*(?:\d{1,3})\s*[.、．)）:：-]?\s+(?=\S)/,'').trim());if(new Set(c.students).size!==c.students.length){alert('名單有重複姓名，請先修正');return}c.picked=c.picked.filter(s=>c.students.includes(s));c.nameRoster={students:c.students,picked:c.picked};close();update()}}
function escapeHtml(t){return t.replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))};function numberSetup(){let c=current();modal(`<h2>🔢 設定號碼抽籤</h2><p class="notice">不需要姓名！輸入人數，就會自動產生 1 號到指定號碼。修改人數時，已抽過且仍在範圍內的號碼會保留。</p><label>抽籤人數（1～60）</label><input id="numberCount" type="number" min="1" max="60" value="${c.numberRoster.students.length}"><div class="actions"><button id="cancel">取消</button><button id="saveCount">套用號碼</button></div>`);$('cancel').onclick=close;$('saveCount').onclick=()=>{let n=Number($('numberCount').value);if(!Number.isInteger(n)||n<1||n>60){alert('請輸入 1～60 的整數');return}let arr=Array.from({length:n},(_,i)=>String(i+1));c.numberRoster={students:arr,picked:c.numberRoster.picked.filter(x=>arr.includes(x))};if(c.mode==='number'){c.students=c.numberRoster.students;c.picked=c.numberRoster.picked}close();update()}};
$('drawMode').onchange=e=>{if(busy){e.target.value=current().mode;return}let c=current();if(c.mode==='name')c.nameRoster={students:c.students,picked:c.picked};else c.numberRoster={students:c.students,picked:c.picked};c.mode=e.target.value;let r=c.mode==='name'?c.nameRoster:c.numberRoster;c.students=r.students;c.picked=r.picked;update()};$('numberSetup').onclick=()=>{if(!busy)numberSetup()};
$('displayMode').onchange=e=>{displayMode=e.target.value;localStorage.setItem('yezi_ufo_display_mode',displayMode);if(!busy)draw()};$('edit').onclick=()=>{if(!busy)edit()};$('add').onclick=()=>{if(busy)return;modal('<h2>＋ 新增班級</h2><label>班級名稱</label><input id="newClass" placeholder="例如：高一甲班"><div class="actions"><button id="cancel">取消</button><button id="create">建立班級</button></div>');$('cancel').onclick=close;$('create').onclick=()=>{let name=$('newClass').value.trim();if(!name)return alert('請輸入班級名稱');if(data.classes.some(c=>c.name===name))return alert('班級名稱已存在');data.classes.push({name,students:[],picked:[],mode:'name',nameRoster:{students:[],picked:[]},numberRoster:{students:Array.from({length:30},(_,i)=>String(i+1)),picked:[]}});data.active=name;close();update();edit()}};$('classSelect').onchange=e=>{if(busy){e.target.value=data.active;return}data.active=e.target.value;update()};$('reset').onclick=()=>{if(busy)return;if(confirm('確定重置本班抽籤紀錄？學生會全部回到街道。')){current().picked=[];update()}};$('history').onclick=()=>{let c=current();modal(`<h2>📋 ${escapeHtml(c.name)} 抽籤紀錄</h2><p>${c.picked.length?c.picked.map((s,i)=>c.mode==='number'?`${escapeHtml(s)}號`:`${String(c.students.indexOf(s)+1).padStart(2,'0')}號 ${escapeHtml(s)}`).join('<br>'):'還沒有人被抓走。'}</p><div class="actions"><button id="cancel">關閉</button></div>`);$('cancel').onclick=close};$('settings').onclick=()=>{modal('<h2>⚙ 遊戲設定</h2><p class="notice">支援姓名抽籤與純號碼抽籤，兩種模式各自保留抽籤紀錄；每次隨機抽取 1 人，同一輪不重複。所有班級名單與進度只儲存在此瀏覽器的 localStorage，不會上傳雲端。<br>音效由瀏覽器即時合成，請先按下開始按鈕以啟用聲音。</p><div class="actions"><button id="delete">刪除目前班級</button><button id="cancel">關閉</button></div>');$('cancel').onclick=close;$('delete').onclick=()=>{if(data.classes.length===1)return alert('至少保留一個班級');if(confirm('確定刪除目前班級及名單？')){data.classes=data.classes.filter(c=>c.name!==data.active);data.active=data.classes[0].name;close();update()}}};$('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 音效：開':'🔇 音效：關';if(soundOn)tone(560,.16)};
// NPC cars render on their own foreground road layer, above the sidewalk pedestrians in depth but physically below their feet. SVG road-space coordinates only (y=609..697); students stay on the shopfront sidewalk above the road.
const trafficLayer=$('npcTraffic');
const trafficCars=[
 {x:-220,y:638,v:58,dir:1,color:'#cb7160',kind:'sedan'},
 {x:800,y:674,v:43,dir:-1,color:'#fff4db',kind:'taxi'},
 {x:1540,y:638,v:65,dir:-1,color:'#86b9b4',kind:'van'},
 {x:330,y:674,v:49,dir:1,color:'#e6ad55',kind:'sedan'}
];
function carSvg(c){let van=c.kind==='van',w=van?150:125;
 return `<g transform="translate(${c.x} ${c.y}) scale(${c.dir} 1)"><ellipse cx="${w/2}" cy="21" rx="${w/2}" ry="6" fill="#263c4450"/><rect x="3" y="-24" width="${w-6}" height="36" rx="10" fill="${c.color}" stroke="#50676a" stroke-width="2"/><path d="M26 -24L40 -47H${w-42}L${w-23} -24Z" fill="${c.color}" stroke="#50676a" stroke-width="2"/><path d="M43 -41H${w-46}L${w-34} -26H33Z" fill="#a6dce0"/><path d="M${w/2} -42V-26" stroke="#5b8083" stroke-width="3"/><rect x="${w-13}" y="-12" width="9" height="7" rx="2" fill="#fff1b6"/><circle cx="28" cy="13" r="12" fill="#344b50"/><circle cx="${w-28}" cy="13" r="12" fill="#344b50"/><circle cx="28" cy="13" r="5" fill="#bfc9bd"/><circle cx="${w-28}" cy="13" r="5" fill="#bfc9bd"/></g>`}
let trafficPrev=0;
function animateTraffic(t){requestAnimationFrame(animateTraffic);let dt=Math.min((t-trafficPrev||16)/1000,.05);trafficPrev=t;
 // Independent traffic lanes; avoid car-to-car overlap by keeping following cars apart.
 for(const c of trafficCars){let next=c.x+c.v*dt*c.dir;const others=trafficCars.filter(o=>o!==c&&o.y===c.y&&o.dir===c.dir);
  let blocked=others.some(o=>{let d=(o.x-c.x)*c.dir;return d>0&&d<195});
  if(!blocked)c.x=next;
  if(c.dir===1&&c.x>1650)c.x=-240;
  if(c.dir===-1&&c.x< -240)c.x=1650;
 }
 trafficLayer.innerHTML=trafficCars.map(carSvg).join('');
}
requestAnimationFrame(animateTraffic);
// Ambient pedestrian motion: independent short strolls and pauses; never interferes with UFO capture.
const walkers=new WeakMap();let lastIdle=0;
function ambientWalk(now){
  requestAnimationFrame(ambientWalk);
  if(now-lastIdle<70)return;let dt=Math.min((now-lastIdle||70)/1000,.15);lastIdle=now;
  if(busy)return;
  const nodes=[...document.querySelectorAll('.student:not(.caught)')];
  nodes.forEach((el,i)=>{
    let w=walkers.get(el);
    if(!w){let base=parseFloat(el.style.left)||50;w={x:base,base,target:base,until:now+500+Math.random()*2200,walking:false,speed:1.2+Math.random()*1.2};walkers.set(el,w)}
    if(now>=w.until){
      if(w.walking){w.walking=false;w.target=w.x;w.until=now+900+Math.random()*2600}
      else{w.walking=true;w.target=Math.max(3,Math.min(97,w.base+(Math.random()-.5)*10));w.until=now+2400+Math.random()*3000}
    }
    let difference=w.target-w.x;
    if(w.walking&&Math.abs(difference)>.08){w.x+=Math.sign(difference)*Math.min(Math.abs(difference),w.speed*dt);el.style.setProperty('--face',difference<0?'-1':'1');el.classList.add('idle-walk');el.classList.remove('idle-rest')}
    else{el.classList.remove('idle-walk');el.classList.add('idle-rest')}
    el.style.left=w.x.toFixed(2)+'%';
  });
}
requestAnimationFrame(ambientWalk);
$('start').onclick=start;document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!$('overlay').classList.contains('open')&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();start()}});update();})();
